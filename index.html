<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AnesteSys">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04060d">
<title>AnesteSys Pro</title>

<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2304060d'/><text y='68' x='50' text-anchor='middle' font-size='55' font-family='monospace' fill='%2300e5ff'>&#x2665;</text></svg>">
<link rel="stylesheet" href="css/main.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div id="modals-container"></div>

<div class="app">

  <div class="topbar">
    <div class="brand">
      <i class="ph-bold ph-stethoscope" style="font-size:15px;margin-right:6px;opacity:.7"></i>Aneste<span>Sys</span>
    </div>
    <div class="topbar-info" id="topbar-pac" onclick="openPacModal()"
         style="cursor:pointer;padding:4px 8px;border-radius:8px;border:1px dashed var(--border);min-width:120px">
      <span id="tb-cat" style="font-size:11px;margin-right:3px">🔒</span>
      <b id="tb-nombre">✏️ Nuevo Paciente</b><br>
      <span id="tb-sub" style="font-size:9px">Toca para editar</span>
    </div>
    <div class="topbar-clock" id="topbar-clock">--:--</div>
  </div>

  <div class="pages" id="pages-container">
    <div id="app-loading" style="display:flex;flex-direction:column;align-items:center;
         justify-content:center;height:100%;gap:16px;color:var(--muted)">
      <div style="font-size:40px;animation:blink 1.2s infinite">♥</div>
      <div style="font-size:13px;letter-spacing:2px;text-transform:uppercase">Cargando…</div>
    </div>
  </div>

  <nav class="bottomnav">
    <button class="navbtn active" onclick="nav('monitor',this)" id="nb-monitor">
      <i class="ph-bold ph-heartbeat nav-ico"></i><span class="label">Monitor</span>
    </button>
    <button class="navbtn" onclick="nav('liq',this)" id="nb-liq">
      <i class="ph-bold ph-drop nav-ico"></i><span class="label">Líquidos</span>
    </button>
    <button class="navbtn" onclick="nav('vent',this)" id="nb-vent">
      <i class="ph-bold ph-wind nav-ico"></i><span class="label">Ventil.</span>
    </button>
    <button class="navbtn" onclick="nav('farm',this)" id="nb-farm">
      <i class="ph-bold ph-syringe nav-ico"></i><span class="label">Fármacos</span>
    </button>
    <button class="navbtn" onclick="nav('alert',this)" id="nb-alert" style="position:relative">
      <i class="ph-bold ph-warning nav-ico"></i><span class="label">Alertas</span>
      <span class="badge r" id="alert-badge" style="position:absolute;top:4px;right:6px;font-size:9px;padding:1px 5px;display:none">0</span>
    </button>
    <button class="navbtn" onclick="nav('lab',this)" id="nb-lab">
      <i class="ph-bold ph-test-tube nav-ico"></i><span class="label">Labs</span>
    </button>
    <button class="navbtn" onclick="nav('res',this)" id="nb-res">
      <i class="ph-bold ph-file-text nav-ico"></i><span class="label">Resumen</span>
    </button>
  </nav>

</div>

<div id="print-area" style="display:none"></div>

<script>
(function () {
  'use strict';

  var HTML_PAGES = [
    'html/page_monitor.html',
    'html/page_preopera.html',
    'html/page_liquidos.html',
    'html/page_ventilad.html',
    'html/page_farmacos.html',
    'html/page_alertas.html',
    'html/page_resumen.html',
    'html/page_laborat.html',
    'html/page_grande.html',
    'html/page_agenda.html',
  ];

  var JS_MODULES = [
    'js/state.js',
    'js/utils.js',
    'js/alerts.js',
    'js/navigation.js',
    'js/clock.js',
    'js/paciente.js',
    'js/vitals.js',
    'js/chart.js',
    'js/phases.js',
    'js/hourly.js',
    'js/liquidos.js',
    'js/ventilador.js',
    'js/farmacos.js',
    'js/aldrete.js',
    'js/pantalla.js',
    'js/guardar.js',
    'js/editar_vital.js',
    'js/editar_farm.js',
    'js/resumen.js',
    'js/login.js',
    'js/historial.js',
    'js/delete.js',
    'js/alertas_del.js',
    'js/laboratorios.js',
    'js/agenda.js',
    'js/startup.js',
    'js/init.js',
  ];

  var d = new Date();
  var V = d.getFullYear() + '' + (d.getMonth()+1) + '' + d.getDate();

  var pagesEl  = document.getElementById('pages-container');
  var modalsEl = document.getElementById('modals-container');

  function get(url) {
    return fetch(url + '?v=' + V).then(function(r) {
      if (!r.ok) throw new Error('Error ' + r.status + ': ' + url);
      return r.text();
    });
  }

  function loadScript(url) {
    return new Promise(function(resolve, reject) {
      var s = document.createElement('script');
      s.src = url + '?v=' + V;
      s.onload = resolve;
      s.onerror = function() { reject(new Error('Fallo al cargar ' + url)); };
      document.body.appendChild(s);
    });
  }

  function loadScriptsSerial(urls) {
    return urls.reduce(function(p, url) {
      return p.then(function() { return loadScript(url); });
    }, Promise.resolve());
  }

  function loadFirebase() {
    return get('js/firebase-auth.js').then(function(src) {
      var s = document.createElement('script');
      s.type = 'module';
      s.textContent = src;
      document.body.appendChild(s);
    });
  }

  Promise.all([
    Promise.all(HTML_PAGES.map(get)),
    get('html/modals.html')
  ])
  .then(function(res) {
    pagesEl.innerHTML  = res[0].join('\n');
    modalsEl.innerHTML = res[1];
    return loadScriptsSerial(JS_MODULES);
  })
  .then(loadFirebase)
  .catch(function(err) {
    console.error('[AnesteSys]', err);
    pagesEl.innerHTML =
      '<div style="padding:24px;font-family:monospace;line-height:2">' +
      '<b style="color:#ff1744;font-size:16px">⚠️ ' + err.message + '</b><br>' +
      '<span style="color:#3d5a78;font-size:12px">' +
      'Ejecuta desde un servidor HTTP — no abrir como file://<br>' +
      '<code style="color:#00e5ff">npx serve .</code></span></div>';
  });
})();
</script>

</body>
</html>
