<div class="page" id="page-agenda">
  <!-- Header vista + nav periodo -->
  <div style="background:linear-gradient(135deg,rgba(255,109,0,.07),rgba(0,229,255,.04));border:1px solid rgba(255,109,0,.2);border-radius:14px;padding:12px 14px;margin-bottom:10px">
    <div style="display:flex;gap:6px;margin-bottom:10px">
      <button id="ag-vbtn-mes"     onclick="agSetView('mes')"     style="flex:1;padding:7px 4px;border-radius:9px;border:1.5px solid #1e2d44;background:transparent;color:#3d5a78;font-size:11px;font-weight:800;cursor:pointer"><i class="ph ph-calendar-blank" style="margin-right:3px"></i>Mes</button>
      <button id="ag-vbtn-semana"  onclick="agSetView('semana')"  style="flex:1;padding:7px 4px;border-radius:9px;border:1.5px solid #1e2d44;background:transparent;color:#3d5a78;font-size:11px;font-weight:800;cursor:pointer"><i class="ph ph-calendar-dots" style="margin-right:3px"></i>Semana</button>
      <button id="ag-vbtn-lista"   onclick="agSetView('lista')"   style="flex:1;padding:7px 4px;border-radius:9px;border:1.5px solid #1e2d44;background:transparent;color:#3d5a78;font-size:11px;font-weight:800;cursor:pointer"><i class="ph ph-list-bullets" style="margin-right:3px"></i>Lista</button>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <button onclick="agNavPrev()" style="background:rgba(255,109,0,.1);border:1px solid rgba(255,109,0,.25);border-radius:10px;color:#ff6d00;width:36px;height:36px;font-size:20px;font-weight:900;cursor:pointer;line-height:1;flex-shrink:0">&#8249;</button>
      <div style="flex:1;text-align:center">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:2px;color:#ff6d00;font-weight:700;margin-bottom:1px">Agenda</div>
        <div id="ag-periodo-label" style="font-size:16px;font-weight:900;color:#dde8ff">&#8212;</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
        <button onclick="agHoy()" style="background:rgba(255,109,0,.15);border:1.5px solid #ff6d00;border-radius:10px;color:#ff6d00;padding:0 12px;height:36px;font-size:10px;font-weight:800;cursor:pointer">HOY</button>
        <button onclick="agNavNext()" style="background:rgba(255,109,0,.1);border:1px solid rgba(255,109,0,.25);border-radius:10px;color:#ff6d00;width:36px;height:36px;font-size:20px;font-weight:900;cursor:pointer;line-height:1">&#8250;</button>
      </div>
    </div>
    <div id="ag-dow-header" style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:10px;margin-bottom:4px">
      <div style="text-align:center;font-size:9px;font-weight:800;color:#3d5a78">DOM</div>
      <div style="text-align:center;font-size:9px;font-weight:800;color:#3d5a78">LUN</div>
      <div style="text-align:center;font-size:9px;font-weight:800;color:#3d5a78">MAR</div>
      <div style="text-align:center;font-size:9px;font-weight:800;color:#3d5a78">MI&#201;</div>
      <div style="text-align:center;font-size:9px;font-weight:800;color:#3d5a78">JUE</div>
      <div style="text-align:center;font-size:9px;font-weight:800;color:#3d5a78">VIE</div>
      <div style="text-align:center;font-size:9px;font-weight:800;color:#3d5a78">S&#193;B</div>
    </div>
    <div id="ag-swipe-zone" style="touch-action:pan-y">
      <div id="ag-cal-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px"></div>
    </div>
  </div>
  <!-- Día seleccionado -->
  <div id="ag-day-section" style="display:none;background:#0a0f1c;border:1px solid #1e2d44;border-radius:14px;padding:14px 16px;margin-bottom:10px">
    <div id="ag-day-title" style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#ff6d00;margin-bottom:10px">Citas del d&#237;a</div>
    <div id="ag-day-list"></div>
  </div>
  <!-- Próximas citas + buscador -->
  <div style="background:#0a0f1c;border:1px solid #1e2d44;border-radius:14px;padding:14px 16px;margin-bottom:10px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#00e5ff">
        <i class="ph ph-clock-countdown" style="margin-right:5px"></i>Pr&#243;ximas Citas
      </div>
      <div style="display:flex;gap:8px">
        <button onclick="agTestNotification()" title="Probar notificaciones" style="background:rgba(255,214,0,.12);border:1.5px solid #ffd600;border-radius:10px;color:#ffd600;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer">&#128276; Test</button>
        <button onclick="agOpenNew(null)" style="background:linear-gradient(135deg,#ff6d00,#ff9100);border:none;border-radius:10px;color:#fff;padding:8px 16px;font-size:12px;font-weight:800;cursor:pointer">+ Nueva</button>
      </div>
    </div>
    <!-- Buscador -->
    <div style="position:relative;margin-bottom:10px">
      <input id="ag-search" type="search" inputmode="search"
        oninput="agSearchFilter(this.value)"
        placeholder="Buscar paciente, diagn&#243;stico, sala..."
        style="width:100%;padding:10px 36px 10px 14px;background:#04060d;border:1.5px solid #1e2d44;border-radius:10px;color:#dde8ff;font-size:16px;box-sizing:border-box;outline:none;-webkit-appearance:none">
      <button id="ag-search-clear" onclick="agSearchClear()"
        style="display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#3d5a78;font-size:18px;cursor:pointer;padding:4px">&#10005;</button>
    </div>
    <div id="ag-search-info" style="display:none;font-size:11px;color:#3d5a78;margin-bottom:8px"></div>
    <div id="ag-proximas-list" style="overflow:visible">
      <div style="text-align:center;color:#3d5a78;padding:20px;font-size:13px">Sin citas registradas</div>
    </div>
  </div>
</div>

<!-- MODAL NUEVA / EDITAR CITA -->
<div id="ag-modal" style="display:none;position:fixed;inset:0;z-index:450;background:rgba(4,6,13,.97);overflow-y:auto;padding:20px 16px;padding-top:calc(24px + env(safe-area-inset-top))">
  <div style="max-width:480px;margin:0 auto;padding-bottom:40px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
      <div id="ag-modal-title" style="font-size:18px;font-weight:800;color:#ff6d00">Nueva Cita</div>
      <button onclick="agCloseModal()" style="background:#0f1628;border:1px solid #1e2d44;border-radius:8px;color:#dde8ff;padding:8px 14px;font-size:13px;cursor:pointer">&#10005; Cerrar</button>
    </div>
    <div style="margin-bottom:14px">
      <div style="font-size:10px;color:#3d5a78;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">Tipo de cita</div>
      <div id="ag-tipo-btns" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        <button onclick="agSetTipo(this,'cirugia')"     data-tipo="cirugia"     style="padding:10px 4px;border-radius:10px;border:1.5px solid #1e2d44;background:transparent;color:#3d5a78;font-size:11px;font-weight:700;cursor:pointer">&#128298; Cirug&#237;a</button>
        <button onclick="agSetTipo(this,'consulta')"    data-tipo="consulta"    style="padding:10px 4px;border-radius:10px;border:1.5px solid #1e2d44;background:transparent;color:#3d5a78;font-size:11px;font-weight:700;cursor:pointer">&#129658; Consulta</button>
        <button onclick="agSetTipo(this,'seguimiento')" data-tipo="seguimiento" style="padding:10px 4px;border-radius:10px;border:1.5px solid #1e2d44;background:transparent;color:#3d5a78;font-size:11px;font-weight:700;cursor:pointer">&#128203; Seguim.</button>
        <button onclick="agSetTipo(this,'urgencia')"    data-tipo="urgencia"    style="padding:10px 4px;border-radius:10px;border:1.5px solid #1e2d44;background:transparent;color:#3d5a78;font-size:11px;font-weight:700;cursor:pointer">&#128680; Urgencia</button>
        <button onclick="agSetTipo(this,'revision')"    data-tipo="revision"    style="padding:10px 4px;border-radius:10px;border:1.5px solid #1e2d44;background:transparent;color:#3d5a78;font-size:11px;font-weight:700;cursor:pointer">&#128302; Revisi&#243;n</button>
        <button onclick="agSetTipo(this,'otro')"        data-tipo="otro"        style="padding:10px 4px;border-radius:10px;border:1.5px solid #1e2d44;background:transparent;color:#3d5a78;font-size:11px;font-weight:700;cursor:pointer">&#128204; Otro</button>
      </div>
    </div>
    <div style="background:#0a0f1c;border:1px solid #1e2d44;border-radius:12px;padding:14px;margin-bottom:12px">
      <div style="font-size:10px;font-weight:800;color:#00e5ff;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px">Paciente</div>
      <div style="margin-bottom:10px">
        <label style="font-size:10px;color:#3d5a78;display:block;margin-bottom:5px">Nombre completo *</label>
        <input type="text" id="ag-pac-nombre" placeholder="Ej. Juan Garc&#237;a L&#243;pez" style="width:100%;padding:11px;font-size:16px;font-weight:600;background:#04060d;border:1.5px solid #1e2d44;border-radius:8px;color:#dde8ff;box-sizing:border-box">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div>
          <label style="font-size:10px;color:#3d5a78;display:block;margin-bottom:5px">Edad</label>
          <div style="display:flex;gap:6px">
            <input type="number" id="ag-pac-edad" inputmode="numeric" placeholder="&#8212;" style="flex:1;min-width:0;padding:11px;font-size:16px;background:#04060d;border:1.5px solid #1e2d44;border-radius:8px;color:#dde8ff;box-sizing:border-box;text-align:center">
            <select id="ag-pac-edad-unit" style="padding:0 8px;font-size:12px;font-weight:700;background:#04060d;border:1.5px solid #1e2d44;border-radius:8px;color:#3d5a78;cursor:pointer;width:68px;flex-shrink:0">
              <option value="anios" selected>a&#241;os</option>
              <option value="meses">meses</option>
              <option value="semanas">sem.</option>
              <option value="dias">d&#237;as</option>
            </select>
          </div>
        </div>
        <div>
          <label style="font-size:10px;color:#3d5a78;display:block;margin-bottom:5px">Expediente</label>
          <input type="text" id="ag-pac-exp" placeholder="&#8212;" style="width:100%;padding:11px;font-size:14px;background:#04060d;border:1.5px solid #1e2d44;border-radius:8px;color:#dde8ff;box-sizing:border-box">
        </div>
      </div>
      <div>
        <label style="font-size:10px;color:#3d5a78;display:block;margin-bottom:5px">Diagn&#243;stico / Procedimiento</label>
        <input type="text" id="ag-pac-dx" placeholder="Ej. Colecistectom&#237;a laparosc&#243;pica" style="width:100%;padding:11px;font-size:16px;background:#04060d;border:1.5px solid #1e2d44;border-radius:8px;color:#dde8ff;box-sizing:border-box">
      </div>
    </div>
    <div style="background:#0a0f1c;border:1px solid #1e2d44;border-radius:12px;padding:14px;margin-bottom:12px">
      <div style="font-size:10px;font-weight:800;color:#ff6d00;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px">Fecha y Hora</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div>
          <label style="font-size:10px;color:#3d5a78;display:block;margin-bottom:5px">Fecha *</label>
          <input type="date" id="ag-fecha" style="width:100%;padding:11px;font-size:14px;font-weight:700;background:#04060d;border:1.5px solid #ff6d00;border-radius:8px;color:#ff9100;box-sizing:border-box">
        </div>
        <div>
          <label style="font-size:10px;color:#3d5a78;display:block;margin-bottom:5px">Hora</label>
          <input type="time" id="ag-hora" style="width:100%;padding:11px;font-size:14px;font-weight:700;background:#04060d;border:1.5px solid #ff6d00;border-radius:8px;color:#ff9100;box-sizing:border-box">
        </div>
        <div>
          <label style="font-size:10px;color:#3d5a78;display:block;margin-bottom:5px">Sala / Quir&#243;fano</label>
          <input type="text" id="ag-sala" placeholder="Ej. Qx 3" style="width:100%;padding:11px;font-size:16px;background:#04060d;border:1.5px solid #1e2d44;border-radius:8px;color:#dde8ff;box-sizing:border-box">
        </div>
        <div>
          <label style="font-size:10px;color:#3d5a78;display:block;margin-bottom:5px">Duraci&#243;n (min)</label>
          <input type="number" id="ag-duracion" inputmode="numeric" placeholder="60" style="width:100%;padding:11px;font-size:16px;background:#04060d;border:1.5px solid #1e2d44;border-radius:8px;color:#dde8ff;box-sizing:border-box;text-align:center">
        </div>
      </div>
    </div>
    <div style="background:#0a0f1c;border:1px solid #1e2d44;border-radius:12px;padding:14px;margin-bottom:12px">
      <div style="font-size:10px;font-weight:800;color:#ffd600;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px">Recordatorio</div>
      <div id="ag-remind-btns" style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px">
        <button onclick="agSetRemind(this,0)"    data-min="0"    style="padding:9px 2px;border-radius:10px;border:1.5px solid #1e2d44;background:transparent;color:#3d5a78;font-size:10px;font-weight:700;cursor:pointer">Sin rec.</button>
        <button onclick="agSetRemind(this,15)"   data-min="15"   style="padding:9px 2px;border-radius:10px;border:1.5px solid #1e2d44;background:transparent;color:#3d5a78;font-size:10px;font-weight:700;cursor:pointer">15 min</button>
        <button onclick="agSetRemind(this,30)"   data-min="30"   style="padding:9px 2px;border-radius:10px;border:1.5px solid #1e2d44;background:transparent;color:#3d5a78;font-size:10px;font-weight:700;cursor:pointer">30 min</button>
        <button onclick="agSetRemind(this,60)"   data-min="60"   style="padding:9px 2px;border-radius:10px;border:1.5px solid #1e2d44;background:transparent;color:#3d5a78;font-size:10px;font-weight:700;cursor:pointer">1 hora</button>
        <button onclick="agSetRemind(this,120)"  data-min="120"  style="padding:9px 2px;border-radius:10px;border:1.5px solid #1e2d44;background:transparent;color:#3d5a78;font-size:10px;font-weight:700;cursor:pointer">2 horas</button>
        <button onclick="agSetRemind(this,360)"  data-min="360"  style="padding:9px 2px;border-radius:10px;border:1.5px solid #1e2d44;background:transparent;color:#3d5a78;font-size:10px;font-weight:700;cursor:pointer">6 horas</button>
        <button onclick="agSetRemind(this,1440)" data-min="1440" style="padding:9px 2px;border-radius:10px;border:1.5px solid #1e2d44;background:transparent;color:#3d5a78;font-size:10px;font-weight:700;cursor:pointer">1 d&#237;a</button>
        <button onclick="agSetRemind(this,2880)" data-min="2880" style="padding:9px 2px;border-radius:10px;border:1.5px solid #1e2d44;background:transparent;color:#3d5a78;font-size:10px;font-weight:700;cursor:pointer">2 d&#237;as</button>
      </div>
    </div>
    <div id="ag-estado-sec" style="display:none;background:#0a0f1c;border:1px solid #1e2d44;border-radius:12px;padding:14px;margin-bottom:12px">
      <div style="font-size:10px;font-weight:800;color:#dde8ff;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px">Cambiar Estado</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <button onclick="agSetEstado('completada')" style="padding:10px;border-radius:10px;border:1.5px solid #00e676;background:rgba(0,230,118,.1);color:#00e676;font-size:12px;font-weight:700;cursor:pointer">Completada</button>
        <button onclick="agSetEstado('cancelada')"  style="padding:10px;border-radius:10px;border:1.5px solid #3d5a78;background:rgba(61,90,120,.15);color:#3d5a78;font-size:12px;font-weight:700;cursor:pointer">Cancelar</button>
      </div>
    </div>
    <div style="margin-bottom:16px">
      <label style="font-size:10px;color:#3d5a78;text-transform:uppercase;letter-spacing:1.5px;display:block;margin-bottom:8px">Notas</label>
      <textarea id="ag-notas" rows="3" placeholder="Ej. Ayuno 8h, alergia penicilina, ASA III..." style="width:100%;padding:11px;font-size:16px;background:#04060d;border:1.5px solid #1e2d44;border-radius:8px;color:#dde8ff;box-sizing:border-box;resize:none;font-family:inherit"></textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <button id="ag-del-btn" onclick="agDelCita()" style="display:none;padding:14px;font-size:14px;font-weight:700;background:rgba(255,23,68,.15);border:1px solid #ff1744;border-radius:12px;color:#ff1744;cursor:pointer">Eliminar</button>
      <button id="ag-save-btn" onclick="agSaveCita()" style="grid-column:1/-1;padding:14px;font-size:15px;font-weight:800;background:linear-gradient(135deg,#ff6d00,#ff9100);border:none;border-radius:12px;color:#fff;cursor:pointer">Guardar Cita</button>
    </div>
  </div>
</div>
