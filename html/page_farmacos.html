<!-- ══ FÁRMACOS ══ -->
<div class="page" id="page-farm">
  <!-- Dosis acumulada resumen -->
  <div id="farm-acum-bar" style="display:none;background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px">
    <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:700">💊 Dosis acumulada del procedimiento</div>
    <div id="farm-acum-list" style="display:flex;flex-wrap:wrap;gap:6px"></div>
  </div>

  <div class="section">
    <div class="section-header"><h2><i class="ph ph-pill sec-ico"></i>Nuevo Medicamento</h2>
      <button class="btn sm" style="background:rgba(255,109,0,.15);border-color:var(--orange);color:var(--orange)" onclick="openDosisCalc()">⚖️ Calc. dosis</button>
    </div>
    <div class="section-body">
      <div class="field"><label>Fármaco</label>
        <input type="text" id="fn" list="fdl" placeholder="Buscar o escribir..." oninput="sugerirDosis(this.value)">
        <datalist id="fdl">
          <!-- Opioides -->
          <option value="Fentanilo"><option value="Sufentanilo"><option value="Morfina">
          <option value="Tramadol"><option value="Remifentanilo"><option value="Buprenorfina">
          <!-- Hipnóticos intravenosos -->
          <option value="Propofol"><option value="Ketamina"><option value="Midazolam">
          <option value="Etomidato"><option value="Tiopental"><option value="Dexmedetomidina">
          <!-- Relajantes musculares -->
          <option value="Rocuronio"><option value="Vecuronio"><option value="Cisatracurio">
          <option value="Succinilcolina"><option value="Mivacurio">
          <!-- Reversión BNM -->
          <option value="Neostigmina"><option value="Sugammadex">
          <option value="Atropina"><option value="Glicopirrolato">
          <!-- Vasoactivos -->
          <option value="Efedrina"><option value="Fenilefrina"><option value="Norepinefrina">
          <option value="Adrenalina"><option value="Dopamina"><option value="Dobutamina">
          <option value="Vasopresina"><option value="Nitroglicerina"><option value="Nitroprusiato">
          <option value="Metaraminol">
          <!-- AINE / Analgésicos -->
          <option value="Ketorolaco"><option value="Paracetamol IV"><option value="Dipirona">
          <option value="Dexketoprofeno"><option value="Diclofenaco"><option value="Ibuprofeno IV">
          <option value="Celecoxib"><option value="Metamizol">
          <!-- Antieméticos -->
          <option value="Ondansetrón"><option value="Metoclopramida"><option value="Dexametasona">
          <option value="Droperidol"><option value="Escopolamina">
          <!-- Anticolinérgicos / Beta -->
          <option value="Labetalol"><option value="Esmolol"><option value="Metoprolol">
          <option value="Amiodarona"><option value="Lidocaína IV">
          <!-- Anestésicos locales -->
          <option value="Lidocaína 1%"><option value="Lidocaína 2%"><option value="Lidocaína 10% (tópica)">
          <option value="Bupivacaína 0.25%"><option value="Bupivacaína 0.5%"><option value="Bupivacaína 0.5% con glucosa">
          <option value="Ropivacaína 0.2%"><option value="Ropivacaína 0.375%"><option value="Ropivacaína 0.5%"><option value="Ropivacaína 0.75%">
          <option value="Levobupivacaína 0.5%"><option value="Mepivacaína 1%"><option value="Mepivacaína 2%">
          <!-- Corticoides -->
          <option value="Dexametasona 4mg"><option value="Hidrocortisona"><option value="Metilprednisolona">
          <!-- Anticoagulantes -->
          <option value="Heparina"><option value="Protamina">
          <!-- Otros -->
          <option value="Neostigmina + Atropina"><option value="Sugammadex 200mg">
          <option value="Insulina regular"><option value="Glucosa 50%">
          <option value="Bicarbonato de sodio"><option value="Calcio gluconato">
          <option value="Magnesio sulfato"><option value="Furosemida">
        </datalist>
      </div>
      <!-- Sugerencia dosis/peso -->
      <div id="farm-dosis-hint" style="display:none;background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.2);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:11px;color:var(--cyan)"></div>
      <div class="field-row">
        <div class="field"><label>Dosis</label><input type="text" id="fd" placeholder="ej. 100 mcg"></div>
        <div class="field"><label>Vía</label>
          <select id="fv"><option>IV</option><option>IM</option><option>SC</option><option>IO</option><option>IT</option><option>Epidural</option><option>Instil.</option><option>Inhal.</option></select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Hora exacta</label><input type="time" id="fh"></div>
        <div class="field"><label>Indicación</label><input type="text" id="fnota" placeholder="Para qué..."></div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Tipo de administración</label>
          <select id="ftipo">
            <option value="Bolo">Bolo / Dosis única</option>
            <option value="Infusión">Infusión continua</option>
            <option value="Goteo">Goteo</option>
          </select>
        </div>
        <div class="field" id="farm-vel-field" style="display:none">
          <label>Velocidad</label>
          <input type="text" id="fvel" placeholder="mcg/kg/min / ml/h">
        </div>
      </div>
      <button class="btn o full" onclick="addFarm()">+ Registrar Medicamento</button>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <h2><i class="ph ph-syringe sec-ico"></i>Medicamentos Administrados</h2>
      <span class="badge" id="farm-badge">0</span>
    </div>
    <div class="section-body" id="farm-list" style="padding-top:8px">
      <div style="text-align:center;color:var(--muted);padding:20px;font-size:13px">Sin registros</div>
    </div>
  </div>
</div><!-- /farm -->
