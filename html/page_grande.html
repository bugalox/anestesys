<!-- ══ PANTALLA GRANDE ══ -->
<div id="bigscreen-overlay" style="display:none;position:fixed;inset:0;z-index:300;background:#000;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)">
  <!-- Close button -->
  <button onclick="toggleBigScreen()" style="position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:50%;width:44px;height:44px;color:#fff;font-size:20px;cursor:pointer;line-height:44px;text-align:center">✕</button>
  <!-- Patient name -->
  <div id="bs-nombre" style="font-size:13px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;padding:0 60px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%"></div>
  <!-- Vital numbers grid -->
  <div style="display:grid;grid-template-columns:1fr 1fr;width:100%;padding:0 12px;gap:4px;flex:1;align-content:center">
    <div style="background:#0a1a2a;border-radius:14px;padding:10px;text-align:center">
      <div style="font-size:9px;color:#3d5a78;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px">TA mmHg</div>
      <div style="font-size:52px;font-weight:900;color:#00e5ff;line-height:1" id="bs-ta">--/--</div>
    </div>
    <div style="background:#0a1a2a;border-radius:14px;padding:10px;text-align:center">
      <div style="font-size:9px;color:#3d5a78;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px">FC lpm</div>
      <div style="font-size:52px;font-weight:900;color:#ff6d00;line-height:1" id="bs-fc">--</div>
    </div>
    <div style="background:#0a1a2a;border-radius:14px;padding:10px;text-align:center">
      <div style="font-size:9px;color:#3d5a78;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px">SpO₂ %</div>
      <div style="font-size:52px;font-weight:900;color:#00e676;line-height:1" id="bs-spo2">--</div>
    </div>
    <div style="background:#0a1a2a;border-radius:14px;padding:10px;text-align:center">
      <div style="font-size:9px;color:#3d5a78;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px">EtCO₂ mmHg</div>
      <div style="font-size:52px;font-weight:900;color:#d500f9;line-height:1" id="bs-etco2">--</div>
    </div>
    <div style="background:#0a1a2a;border-radius:14px;padding:10px;text-align:center">
      <div style="font-size:9px;color:#3d5a78;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px">PAM mmHg</div>
      <div style="font-size:52px;font-weight:900;color:#d500f9;line-height:1" id="bs-pam">--</div>
    </div>
    <div style="background:#0a1a2a;border-radius:14px;padding:10px;text-align:center">
      <div style="font-size:9px;color:#3d5a78;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px">T. Anest.</div>
      <div style="font-size:38px;font-weight:900;color:#00e5ff;line-height:1" id="bs-timer">--:--</div>
    </div>
  </div>
  <!-- Registrar button in bigscreen -->
  <button onclick="registrar();flashBigScreen()" style="margin:12px auto;width:calc(100% - 24px);padding:18px;font-size:16px;font-weight:800;background:linear-gradient(135deg,#00e676,#00c853);border:none;border-radius:14px;color:#000;cursor:pointer;letter-spacing:.5px">📌 Registrar Punto</button>
</div>
