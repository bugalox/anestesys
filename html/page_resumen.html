<!-- ══ RESUMEN / PDF ══ -->
<div class="page" id="page-res">
  <div id="res-inst-header" style="font-size:10px;color:var(--muted);text-align:center;padding:4px 0;display:none"></div>
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
    <button class="btn g" onclick="genRes()" title="Actualiza el resumen con los datos actuales del caso"><i class="ph ph-arrow-clockwise btn-ico"></i>Actualizar Resumen</button>
    <button class="btn" onclick="genRes();document.getElementById('print-area').style.display='block';window.print();setTimeout(()=>document.getElementById('print-area').style.display='none',2000)">🖨️ Imprimir / PDF</button>
    <button class="btn" onclick="shareResumen()" style="background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;border:none;display:flex;align-items:center;gap:6px"><i class="ph ph-file-pdf btn-ico"></i>Compartir PDF</button>
    <button class="btn o" onclick="copiarRes()">📋 Copiar</button>
  </div>
  <div style="background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:11px;color:var(--muted)">
    💡 Para guardar PDF: toca "Imprimir" → selecciona <b style="color:var(--white)">Guardar como PDF</b> (en Safari) o <b style="color:var(--white)">Compartir → Guardar en Archivos</b>
  </div>

  <div id="res-content">
    <div style="text-align:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)">
      <div style="font-size:20px;font-weight:800;color:var(--cyan)">REGISTRO ANESTÉSICO</div>
      <div style="font-size:11px;color:var(--muted)">Anestesiología · Registro Perioperatorio</div>
      <div style="font-size:10px;color:var(--muted);margin-top:2px" id="res-fecha"></div>
    </div>
    <div id="res-pac" class="res-section"></div>
    <div id="res-vitales" class="res-section"></div>
    <div id="res-liq" class="res-section"></div>
    <div id="res-farms" class="res-section"></div>
    <div id="res-vent" class="res-section"></div>
    <div id="res-aldrete" class="res-section"></div>
  </div>

  <!-- POSTOPERATORIO UCPA -->
  <div class="section" style="margin-top:12px">
    <div class="section-header"><h2><i class="ph ph-hospital sec-ico"></i>Post-Operatorio / UCPA</h2></div>
    <div class="section-body">
      <!-- EVA Dolor -->
      <div style="margin-bottom:14px">
        <label style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:8px">Dolor (EVA 0–10)</label>
        <div style="display:flex;align-items:center;gap:10px">
          <input type="range" id="po-eva" min="0" max="10" value="0" step="1" style="flex:1" oninput="updEVA(this.value)">
          <div style="min-width:48px;text-align:center">
            <div style="font-size:28px;font-weight:900;color:var(--green)" id="po-eva-val">0</div>
            <div style="font-size:9px;color:var(--muted)" id="po-eva-lbl">Sin dolor</div>
          </div>
        </div>
      </div>

      <!-- Síntomas -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
        <div>
          <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:5px">Náusea / Vómito</label>
          <select id="po-nausea" style="width:100%">
            <option value="No">No</option>
            <option value="Náusea leve">Náusea leve</option>
            <option value="Náusea moderada">Náusea moderada</option>
            <option value="Vómito">Vómito</option>
            <option value="Vómito profuso">Vómito profuso</option>
          </select>
        </div>
        <div>
          <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:5px">Escalofrío</label>
          <select id="po-shivering">
            <option value="No">No</option>
            <option value="Leve">Leve</option>
            <option value="Moderado">Moderado</option>
            <option value="Intenso">Intenso</option>
          </select>
        </div>
      </div>

      <!-- Analgesia postop -->
      <div class="field" style="margin-bottom:10px">
        <label>Analgesia postoperatoria indicada</label>
        <input type="text" id="po-analgesia" placeholder="Ketorolaco 30mg c/8h + Paracetamol 1g...">
      </div>

      <!-- Horas UCPA + egreso -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
        <div>
          <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:5px">Ingreso UCPA</label>
          <input type="time" id="po-ingucpa" style="width:100%;padding:10px;font-size:15px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--white);box-sizing:border-box">
        </div>
        <div>
          <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:5px">Egreso a piso</label>
          <input type="time" id="po-egreso" style="width:100%;padding:10px;font-size:15px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--white);box-sizing:border-box">
        </div>
      </div>

      <!-- Destino al egreso -->
      <div class="field">
        <label>Destino al egreso</label>
        <select id="po-destino">
          <option>Piso general</option>
          <option>UCI / UTI</option>
          <option>Domicilio</option>
          <option>Terapia intermedia</option>
          <option>Otro</option>
        </select>
      </div>

      <!-- Notas postop -->
      <div class="field">
        <label>Observaciones postoperatorias</label>
        <textarea id="po-notas" rows="2" style="width:100%;resize:vertical;font-size:13px;padding:10px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--white)" placeholder="Extubado en sala, tolerando vía oral, sin complicaciones..."></textarea>
      </div>
    </div>
  </div>

  <!-- ALDRETE -->
  <div class="section" style="margin-top:12px">
    <div class="section-header"><h2><i class="ph ph-clipboard-text sec-ico"></i>Escala Aldrete</h2></div>
    <div class="section-body">
      <div class="field"><label>Actividad</label>
        <select id="al-act" onchange="calcAld()"><option value="2">Mueve 4 extremidades — 2</option><option value="1">Mueve 2 — 1</option><option value="0">No mueve — 0</option></select></div>
      <div class="field"><label>Respiración</label>
        <select id="al-resp" onchange="calcAld()"><option value="2">Profunda, tose — 2</option><option value="1">Disnea — 1</option><option value="0">Apnea — 0</option></select></div>
      <div class="field"><label>Circulación</label>
        <select id="al-circ" onchange="calcAld()"><option value="2">±20% preanest. — 2</option><option value="1">20–50% — 1</option><option value="0">&gt;50% — 0</option></select></div>
      <div class="field"><label>Conciencia</label>
        <select id="al-conc" onchange="calcAld()"><option value="2">Completamente despierto — 2</option><option value="1">Al llamado — 1</option><option value="0">No responde — 0</option></select></div>
      <div class="field"><label>SpO2</label>
        <select id="al-sat" onchange="calcAld()"><option value="2">&gt;92% en aire — 2</option><option value="1">Necesita O2 — 1</option><option value="0">&lt;90% — 0</option></select></div>
      <div style="text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:10px">
        <div style="font-size:52px;font-weight:800;color:var(--green)" id="ald-score">10</div>
        <div style="font-size:13px;margin-top:4px" id="ald-status" style="color:var(--green)">✓ Alta Autorizada</div>
      </div>
    </div>
  </div>
</div><!-- /res -->
